<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Code Analysis Dashboard</title>
    <link rel="stylesheet" href="test-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-chart-line"></i> Salesforce Analysis Dashboard</h1>
            <p class="subtitle">Monitor Apex tests and Code Analyzer results across all repositories</p>
        </header>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalRepos">0</div>
                <div class="stat-label">Total Repositories</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="apexRepos">0</div>
                <div class="stat-label">With Apex Reports</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="analyzerRepos">0</div>
                <div class="stat-label">With Analyzer Reports</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="allReportsRepos">0</div>
                <div class="stat-label">Complete Reports</div>
            </div>
        </div>
        
        <div class="filters">
            <button id="filterAll" class="filter-btn active">All Repositories</button>
            <button id="filterApex" class="filter-btn">With Apex Reports</button>
            <button id="filterAnalyzer" class="filter-btn">With Analyzer Reports</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> Loading dashboard data...
        </div>
        
        <div id="dashboardGrid" class="dashboard-grid">
            <!-- Cards will be inserted here by JavaScript -->
        </div>
    </div>
    
    <button id="refreshBtn" class="refresh-btn" title="Refresh Dashboard">
        <i class="fas fa-sync-alt"></i>
    </button>
    
    <script src="test-script.js"></script>
</body>
</html>
