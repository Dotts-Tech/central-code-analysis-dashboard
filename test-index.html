<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Salesforce Code Analyzer Dashboard</title>
    <link rel="stylesheet" href="test-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
  <body>
   <header>
      <div class="header-left">
        <h1>Salesforce Code Analyzer Dashboard</h1>
      </div>
      <div class="header-right">
        <img src="dotts.png" class="logo" />
      </div>
    </header>

    <main id="results">
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <p>Loading dashboard...</p>
      </div>
    </main>

    <!-- Modal for reports -->
    <div id="report-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Report</h2>
          <div class="modal-actions">
            <button id="modal-download-btn" class="download-btn">
              <i class="fas fa-download"></i> Download
            </button>
            <button class="close-button">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
        <div class="modal-body">
          <iframe id="report-frame"></iframe>
        </div>
      </div>
    </div>

    <script src="test-script.js"></script>
  </body>
</html>
