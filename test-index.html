<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dotts Salesforce Analysis Dashboard</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="test-style.css">
</head>
<body>

    <div class="container">
        <!-- NEW: Header with Logo and Title -->
        <div class="dashboard-header">
            <img class="dashboard-logo" src="dotts.png" alt="Dotts Logo">
            <h1>Dotts Salesforce Analysis Dashboard</h1>
        </div>
        
        <!-- Debug View Toggle Button -->
        <div class="debug-toggle-container">
            <button id="debug-toggle-btn">Show Debug View</button>
        </div>

        <div id="dashboard-content" class="loading">
            Loading analysis results...
        </div>

        <!-- Debug Information Container -->
        <div id="debug-view" class="debug-view" style="display: none;">
            <h2>Debug Information</h2>
            <p><strong>Data Source URL:</strong> <code id="debug-url"></code></p>
            <p><strong>Raw test-index.json content:</strong></p>
            <pre id="debug-json"></pre>
        </div>
    </div>

    <!-- Modal for viewing reports -->
    <div id="report-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <iframe id="report-frame" src="" title="Analysis Report"></iframe>
        </div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="test-script.js"></script>
</body>
</html>
