<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Central Code Analysis Dashboard</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="test-style.css" />
</head>
<body data-theme="dark">

  <header class="topbar">
    <div class="brand">Central Dotts Saleforce Orgs Reports</div>
    <div class="controls">
      <input id="search" placeholder="Search projects…" />
      <button id="themeToggle">Theme</button>
    </div>
  </header>

  <main class="container">
    <section id="grid" class="grid"></section>
  </main>

  <!-- Modal -->
  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div id="modalTitle" class="modal-title"></div>
          <div id="modalSub" class="modal-sub"></div>
        </div>
        <div class="modal-actions">
          <button id="openNew" class="btn small" title="Open raw report" style="display:none">Open</button>
          <button id="closeModal" class="btn small">Close</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="report">Report</button>
        <button class="tab" data-tab="summary">Summary</button>
        <button class="tab" data-tab="charts">Charts</button>
      </div>

      <div class="tab-content" data-tab-content="report">
        <iframe id="reportFrame" class="report-frame" title="Report viewer"></iframe>
      </div>

      <div class="tab-content" data-tab-content="summary">
        <div id="summaryContent" class="summary-area"></div>
      </div>

      <div class="tab-content" data-tab-content="charts">
        <canvas id="passFailChart" class="chart-canvas"></canvas>
        <canvas id="coverageChart" class="chart-canvas"></canvas>
      </div>
    </div>
  </div>

  <footer class="footer">
    Dashboard reads <code>test-index.json</code> and <code>data/*</code> created by yogesh.
  </footer>

  <script src="test-script.js"></script>
</body>
</html>
