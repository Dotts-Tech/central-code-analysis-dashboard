<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Analysis Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="test-style.css">
</head>
<body>
<div class="container">
    <h1 class="text-center repo-title">barnes - Code Analysis Dashboard</h1>
    <div class="row">
        <div class="col-md-6">
            <div class="card dashboard-card status-success">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-check-circle"></i> Test Results</span>
                    <span class="badge bg-success">0%</span>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-4"><div class="metric-value text-primary">0</div><div class="metric-label">Total</div></div>
                        <div class="col-4"><div class="metric-value text-success">0</div><div class="metric-label">Passed</div></div>
                        <div class="col-4"><div class="metric-value text-danger">0</div><div class="metric-label">Failed</div></div>
                    </div>
                    <div class="mt-3 text-center">
                        <a href="data/barnes-apex.html" class="btn btn-primary"><i class="bi bi-file-text"></i> View Detailed Report</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card dashboard-card status-danger">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-shield-check"></i> Code Coverage</span>
                    <span class="badge bg-danger">0%</span>
                </div>
                <div class="card-body">
                    <div class="progress mb-3" style="height: 25px;">
                        <div class="progress-bar bg-danger" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                    </div>
                    <div class="text-center">
                        <a href="data/barnes-apex.html#coverage" class="btn btn-primary"><i class="bi bi-pie-chart"></i> View Coverage Details</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card dashboard-card status-success">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-search"></i> Code Analyzer</span>
                    <span class="badge bg-success">0 Issues</span>
                </div>
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-12"><div class="metric-value text-warning">0</div><div class="metric-label">Issues Found</div></div>
                    </div>
                    <div class="mt-3 text-center">
                        <a href="data/barnes-analyzer.html" class="btn btn-primary"><i class="bi bi-bug"></i> View Analyzer Report</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card dashboard-card">
                <div class="card-header"><span><i class="bi bi-lightning"></i> Quick Actions</span></div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <a href="data/barnes-apex.json" class="btn btn-outline-primary"><i class="bi bi-code-slash"></i> Download Apex JSON</a>
                        <a href="data/barnes-analyzer.json" class="btn btn-outline-primary"><i class="bi bi-file-earmark-code"></i> Download Analyzer JSON</a>
                        <button class="btn btn-outline-secondary" onclick="window.location.reload()"><i class="bi bi-arrow-clockwise"></i> Refresh Dashboard</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center last-updated">Last updated: 2025-12-08 21:42:58</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="test-script.js"></script>
</body>
</html>
