<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test & Coverage Dashboard</title>
  <link rel="stylesheet" href="test-style.css">
</head>
<body>
  <header>
    <h1>🧪 APEX TEST & COVERAGE REPORT</h1>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button id="theme-toggle">🌙 Toggle Light/Dark</button>
      <a id="download-report" class="download-btn" href="data/apex-report.html" download>⬇️ Download HTML Report</a>
    </div>
    <div class="filters">
      <input type="text" id="filter-class" placeholder="Filter by class name…" />
      <select id="filter-outcome">
        <option value="">All outcomes</option>
        <option value="Pass">Pass</option>
        <option value="Fail">Fail</option>
      </select>
      <select id="filter-coverage">
        <option value="">All coverage</option>
        <option value="high">≥ 90%</option>
        <option value="medium">50–89%</option>
        <option value="low">< 50%</option>
      </select>
    </div>
  </header>

  <main>
    <section>
      <h2>Test results</h2>
      <table id="tests-table">
        <thead>
          <tr>
            <th>Class</th><th>Method</th><th>Outcome</th><th>Message</th><th>StackTrace</th>
          </tr>
        </thead>
        <tbody id="tests-body"></tbody>
      </table>
    </section>

    <section>
      <h2>Coverage results</h2>
      <table id="coverage-table">
        <thead>
          <tr>
            <th>Class/Trigger</th><th>Covered</th><th>Uncovered</th><th>Coverage %</th>
          </tr>
        </thead>
        <tbody id="coverage-body"></tbody>
      </table>
    </section>
  </main>

  <script src="test-script.js"></script>
</body>
</html>
